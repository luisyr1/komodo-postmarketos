# USB network of the Pixel 9 Pro XL (komodo): 172.16.43.0/24, so it does not
# collide with another postmarketOS phone on the same PC (172.16.42.0/24).
# Read twice: sourced as shell by the initramfs (init.sh, lowercase names)
# and as EnvironmentFile= by unudhcpd@.service (uppercase names).
unudhcpd_host_ip=172.16.43.1
unudhcpd_client_ip=172.16.43.2
UNUDHCPD_SERVER=172.16.43.1
UNUDHCPD_CLIENT=172.16.43.2
