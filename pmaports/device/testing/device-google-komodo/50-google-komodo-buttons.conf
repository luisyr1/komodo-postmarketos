# device-google-komodo: power button policy for the console UI.
# postmarketos-base(-systemd) sets HandlePowerKey=ignore so the graphical
# UIs (Phosh, Plasma Mobile, Sxmo...) handle the key themselves; they take
# logind's "handle-power-key" inhibitor lock, which overrides this file.
# With ui=console nobody handles it, so here:
#   short press: nothing (unchanged; no suspend: s2idle is not qualified)
#   long press (>= 5 s, logind): power off
[Login]
HandlePowerKeyLongPress=poweroff
