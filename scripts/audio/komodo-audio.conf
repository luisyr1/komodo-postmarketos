#
# /etc/modprobe.d/komodo-audio.conf - Pixel 9 Pro XL (komodo), audio
# bring-up (docs/MILESTONE-6.md). Install it on the phone BEFORE the first
# boot of a kernel with patches 0019-0021.
#
# Nothing of the AoC or the speaker amplifiers loads by itself. With patches
# 0019-0021 the device tree enables Trusty, the GSA, the AoC, the two CS35L41
# amplifiers and the AoC sound card; without this file their modules would
# autoload at boot in the wrong order (or start the AoC halfway). Only
# komodo-aoc-start (or a step typed by hand) loads them; an explicit
# "modprobe <name>" still works.
#
# The amplifiers run WITHOUT Cirrus' protection firmware and WITHOUT the
# factory calibration. Keep this file in place: it is one of the barriers
# that keep the speakers at the bring-up minimum.
#
# Trusty and the GSA start and authenticate the AoC firmware.
blacklist trusty_core
blacklist trusty_log
blacklist trusty_ipc
blacklist trusty_virtio
blacklist gsa
# The AoC's drivers (gs201_aoc_boot and gs201_aoc_rails only match gs201
# nodes; listed so a future match never starts anything).
blacklist gs201_aoc_sysmmu
blacklist gs201_aoc_boot
blacklist gs201_aoc_rails
blacklist mailbox_wc
blacklist aoc_core
blacklist aoc_channel_dev
blacklist aoc_char_dev
# The sound card would pull aoc_core, gsa and Trusty in ahead of the order.
blacklist aoc_alsa_dev
blacklist aoc_alsa_dev_util
# The CS35L41 amplifiers: loaded only after the AoC is online, and only by
# the bring-up step.
blacklist snd_soc_cs35l41_spi
blacklist snd_soc_cs35l41
